name: 'Setup Zernikalos Build Environment'
description: 'Setup JDK, Android SDK and Gradle for Zernikalos builds'
inputs:
  cache-read-only:
    description: 'Gradle cache read-only mode'
    required: false
    default: 'true'
runs:
  using: 'composite'
  steps:
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      with:
        packages: tools platform-tools platforms;android-36 build-tools;36.0.0

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        cache-read-only: ${{ inputs.cache-read-only }}

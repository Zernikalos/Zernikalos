name: Zernikalos Next Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zernikalos-package-publication
  cancel-in-progress: false

jobs:
  publish-packages:
    name: Build and publish Maven and JS packages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine next package versions
        id: version
        run: python3 scripts/zmanager.py version --show-next --output=github >> "$GITHUB_OUTPUT"

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env

      - name: Build and publish Maven packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAVEN_VERSION: ${{ steps.version.outputs.maven_version }}
        run: >-
          ./gradlew build publishAllPublicationsToMavenRepository
          --no-daemon --no-configuration-cache
          "-Pversion=$MAVEN_VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
          registry-url: 'https://npm.pkg.github.com'
          scope: '@zernikalos'

      - name: Set npm package version
        working-directory: build/js
        env:
          NPM_VERSION: ${{ steps.version.outputs.npm_version }}
        run: npm version "$NPM_VERSION" --workspace=@zernikalos/zernikalos --no-git-tag-version --allow-same-version --ignore-scripts --workspaces-update=false

      - name: Publish JS package
        working-directory: build/js
        run: npm publish --workspace=@zernikalos/zernikalos --ignore-scripts --tag next
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

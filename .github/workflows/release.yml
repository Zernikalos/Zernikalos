name: Zernikalos Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  packages: write
  contents: read
  actions: read

jobs:
  build-and-publish-android:
    name: Build and Publish Android artifacts
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_ACTOR: ${{ github.actor }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env

      - name: Build
        run: ./gradlew build

      - name: Verify build output
        run: |
          echo "Current directory: $(pwd)"
          echo "Build directory contents:"
          ls -la build/ || echo "Build directory does not exist!"
          echo "Gradle build status: $?"

      - name: Publish all publications to Maven Repository
        run: ./gradlew publishAllPublicationsToMavenRepository -Puser=$GITHUB_ACTOR -Paccess_token=$GITHUB_TOKEN

      - name: Upload build artifacts for JS job
        uses: actions/upload-artifact@v5
        with:
          name: build-dir
          path: build
          retention-days: 1

  publish-js:
    name: Publish JS package
    needs: build-and-publish-android
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@zernikalos'

      - name: Download build artifacts from Android job
        uses: actions/download-artifact@v5
        with:
          name: build-dir
          path: build

      - name: Publish JS package
        working-directory: build/js
        run: npm publish --workspace=@zernikalos/zernikalos
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

  create-github-release:
    if: startsWith(github.ref, 'refs/tags/')
    name: Create GitHub Release
    needs: publish-js
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release for tag
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generateReleaseNotes: true
          draft: false
          prerelease: false
          allowUpdates: true

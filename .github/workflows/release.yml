name: Zernikalos Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zernikalos-package-publication
  cancel-in-progress: false

jobs:
  publish-packages:
    name: Build and publish Maven and JS packages
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate publication ref and determine versions
        id: version
        run: python3 scripts/zmanager.py version --validate-tag "$GITHUB_REF" --output=github >> "$GITHUB_OUTPUT"

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env

      - name: Build and publish Maven packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAVEN_VERSION: ${{ steps.version.outputs.maven_version }}
        run: >-
          ./gradlew build publishAllPublicationsToMavenRepository
          --no-daemon --no-configuration-cache
          "-Pversion=$MAVEN_VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
          registry-url: 'https://npm.pkg.github.com'
          scope: '@zernikalos'

      - name: Set npm package version
        working-directory: build/js
        env:
          NPM_VERSION: ${{ steps.version.outputs.npm_version }}
        run: npm version "$NPM_VERSION" --workspace=@zernikalos/zernikalos --no-git-tag-version --allow-same-version --ignore-scripts --workspaces-update=false

      - name: Publish JS package
        working-directory: build/js
        run: npm publish --workspace=@zernikalos/zernikalos --ignore-scripts --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

  create-github-release:
    name: Create GitHub Release
    needs: publish-packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release for validated tag
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generateReleaseNotes: true
          draft: false
          prerelease: false
          allowUpdates: true
